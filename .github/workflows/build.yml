name: Build armv7 Binary

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Modify notice text with Action Run Number
        run: |
          sed -i "s/注意事项/Action #${{ github.run_number }}/g" rust-src/src/playlist.rs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build armv7 binary with cross
        run: cross build --target armv7-unknown-linux-musleabihf --release --manifest-path rust-src/Cargo.toml

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp rust-src/target/armv7-unknown-linux-musleabihf/release/iptv-rust dist/YSP-Yang

      - name: Upload armv7 binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: YSP-Yang-armv7
          path: dist/YSP-Yang
